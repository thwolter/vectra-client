[project]
name = "vectra-client"
version = "0.1.1"
description = "Internal reusable client for querying the Vectra retrieval API."
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 1 - Planning"
]
authors = [
    { name = "Thomas Wolter", email = "support@riskary.de" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=0.3.78",
    "nexor",
    "pydantic>=2.10",
    "tenauth @ git+https://github.com/thwolter/fde-tenauth.git@main",
]

[tool.uv.sources]
nexor = { path = "../nexor", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "isort>=7.0.0",
    "pre-commit>=4.5.0",
    "pyrefly>=0.45.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.8",
    "ssort>=0.16.0",
    "typer>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
